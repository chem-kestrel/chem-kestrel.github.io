<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | KESTREL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy:        #0B2447;
            --navy-mid:    #19376D;
            --accent:      #2171C7;
            --accent-hover:#1558A8;
            --accent-light:#EBF4FF;
            --teal:        #0EA5A0;
            --white:       #ffffff;
            --surface:     #F8FAFD;
            --surface-2:   #EFF4FB;
            --border:      #DDE6F0;
            --border-dark: #BDD0E8;
            --text:        #0F1B2D;
            --text-mid:    #3A4D6B;
            --text-muted:  #6B7C99;
            --font-display:'Arimo', sans-serif;
            --font-body:   'IBM Plex Sans', system-ui, sans-serif;
            --font-mono:   'IBM Plex Mono', monospace;
            --radius-sm:   4px;
            --radius-md:   8px;
            --radius-lg:   12px;
            --shadow-sm:   0 1px 3px rgba(11,36,71,0.08), 0 1px 2px rgba(11,36,71,0.04);
            --shadow-md:   0 4px 12px rgba(11,36,71,0.10), 0 2px 4px rgba(11,36,71,0.06);
            --shadow-lg:   0 10px 30px rgba(11,36,71,0.12), 0 4px 8px rgba(11,36,71,0.06);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.7;
            color: var(--text);
            background: var(--surface);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── MAIN 404 CONTENT ────────────────────────────── */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        .error-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 56px 64px;
            max-width: 620px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* subtle decorative top bar */
        .error-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--navy), var(--accent), var(--teal));
        }

        /* ── KESTREL LOGO ────────────────────────────────── */
        .kestrel-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 8px;
        }

        .kestrel-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: brightness(0) saturate(0);
            animation: hover 3.5s ease-in-out infinite;
            display: block;
            margin: 0 auto 4px;
        }

        /* the kestrel's shadow while hovering */
        .kestrel-shadow {
            width: 50px;
            height: 8px;
            background: radial-gradient(ellipse, rgba(11,36,71,0.18) 0%, transparent 70%);
            border-radius: 50%;
            margin: 0 auto;
            animation: shadowPulse 3.5s ease-in-out infinite;
        }

        /* ── 404 NUMBER ──────────────────────────────────── */
        .error-code {
            font-family: var(--font-display);
            font-size: clamp(4rem, 12vw, 6.5rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--navy);
            margin: 20px 0 4px;
            /* subtle gradient fill */
            background: linear-gradient(135deg, var(--navy) 40%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 0.6s 0.2s ease both;
        }

        /* ── MESSAGES ────────────────────────────────────── */
        .error-title {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--navy-mid);
            margin-bottom: 12px;
            animation: fadeIn 0.6s 0.35s ease both;
        }

        .error-body {
            color: var(--text-muted);
            font-size: 0.97rem;
            line-height: 1.65;
            margin-bottom: 28px;
            animation: fadeIn 0.6s 0.45s ease both;
        }

        /* ── BUTTONS ─────────────────────────────────────── */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 0.6s 0.65s ease both;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 22px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
            font-family: var(--font-display);
        }

        .btn:hover { text-decoration: none; transform: translateY(-1px); }

        .btn-primary {
            background: var(--accent);
            color: var(--white);
            box-shadow: 0 2px 8px rgba(33,113,199,0.30);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 14px rgba(33,113,199,0.40);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-mid);
            border: 1px solid var(--border-dark);
        }

        .btn-outline:hover {
            background: var(--surface-2);
            color: var(--navy);
        }

        /* ── FOOTER ──────────────────────────────────────── */
        footer {
            background: var(--white);
            border-top: 1px solid var(--border);
            padding: 22px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.83rem;
            color: var(--text-muted);
        }

        /* ── ANIMATIONS ───────────────────────────────────── */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes hover {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-12px); }
        }

        @keyframes shadowPulse {
            0%, 100% { transform: scaleX(1);   opacity: 1; }
            50%       { transform: scaleX(0.6); opacity: 0.5; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* ── RESPONSIVE ──────────────────────────────────── */
        @media (max-width: 600px) {
            .error-card { padding: 40px 28px; }
            .ring-1, .ring-2 { display: none; }
        }
    </style>
</head>
<body>

    <!-- MAIN CONTENT -->
    <main>
        <div class="error-card">

            <!-- decorative orbital rings -->
            <div class="orbital-ring ring-1"></div>
            <div class="orbital-ring ring-2"></div>

            <!-- hovering kestrel -->
            <div class="kestrel-wrapper">
                <img
                    src="kestrel_logo.png"
                    alt="Kestrel hovering"
                    class="kestrel-logo"
                >
                <div class="kestrel-shadow"></div>
            </div>

            <!-- 404 number -->
            <div class="error-code">404</div>

            <!-- messages -->
            <h1 class="error-title">Orbital Not Found</h1>

            <p class="error-body">
                It looks like this page has undergone a
                <strong>forbidden electronic transition.</strong>
                Even our kestrel can't spot it from up there.
            </p>

            <!-- navigation buttons -->
            <div class="btn-group">
                <a href="/" class="btn btn-primary">
                    <!-- home icon -->
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Return to Home
                </a>
                <a href="javascript:history.back()" class="btn btn-outline">
                    <!-- back arrow -->
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Go Back
                </a>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <span>© 2026 KESTREL — Ligand Field Calculations</span>
        <span style="font-size:0.8rem; opacity:0.7;">
            Error 404 &nbsp;·&nbsp; Page does not exist
        </span>
    </footer>

</body>
</html>
